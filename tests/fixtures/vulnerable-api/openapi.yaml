openapi: 3.0.3
info:
  title: Vulnerable fixture API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:4010
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
  - bearer: []
paths:
  /api/me:
    get:
      operationId: getMe
      responses:
        "200": { description: Current user }
  /api/reports/summary:
    get:
      operationId: getReportSummary
      responses:
        "200": { description: Revenue summary (should require auth) }
  /api/invoices/{invoiceId}:
    get:
      operationId: getInvoice
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Invoice }
  /api/projects/{projectId}:
    get:
      operationId: getProject
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Project }
  /api/orders:
    post:
      operationId: createOrder
      responses:
        "201": { description: Created }
  /api/orders/{orderId}/ship:
    post:
      operationId: shipOrder
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Shipped }
